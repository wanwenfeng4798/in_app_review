name: in_app_review_pro
description: Flutter plugin for showing the In-App Review/System Rating pop up on Android, iOS and MacOS. It makes it easy for users to rate your app.
version: 0.1.0
homepage: https://github.com/wanwenfeng4798/in_app_review_pro/tree/master/in_app_review_pro
repository: https://github.com/wanwenfeng4798/in_app_review_pro
issue_tracker: https://github.com/wanwenfeng4798/in_app_review_pro/issues

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  in_app_review_pro_platform_interface:
    path: ../in_app_review_pro_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.0.0
  plugin_platform_interface: ^2.0.2

flutter:
  plugin:
    platforms:
      android:
        package: dev.wanwenfeng.in_app_review_pro
        pluginClass: InAppReviewPlugin
      ios:
        pluginClass: InAppReviewPlugin
      macos:
        pluginClass: InAppReviewPlugin

screenshots:
  - description: A screenshot of the iOS rating pop-up.
    path: screenshots/ios.png
